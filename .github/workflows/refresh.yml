name: Refresh profile

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pillow numpy opencv-python-headless rembg onnxruntime

      - name: Generate portrait
        run: |
          python scripts/generate_portrait.py

      - name: Generate stats
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_LOGIN: ${{ github.repository_owner }}
        run: |
          python scripts/generate_stats.py

      - name: Generate profile
        run: |
          python scripts/generate_profile.py

      - name: Commit changes
        run: |
          if [ -z "$(git status --porcelain -- portrait.svg profile.svg stats.svg)" ]; then
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add portrait.svg profile.svg stats.svg
          git commit -m "profile: refresh"
          git push
